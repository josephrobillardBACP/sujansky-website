    <!--
      Local-SEO structured data. Every value here must stay identical to the
      footer NAP and to the Google Business Profile - a mismatch in address or
      phone actively hurts local ranking. Deliberately omitted because they are
      not verified anywhere on the site: opening hours, geo coordinates,
      acceptance of new patients, and any rating.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Physician",
        "@id": "https://sujanskymd.com/#practice",
        "name": "Ulrike Sujansky, M.D.",
        "description": "Concierge primary care practice in San Mateo, California, offering extended, unhurried visits and 24/7 access to your physician.",
        "url": "https://sujanskymd.com/",
        "image": "https://sujanskymd.com/brand-logo.png",
        "logo": "https://sujanskymd.com/brand-logo.png",
        "telephone": "+1-650-393-5851",
        "faxNumber": "+1-650-393-5871",
        "medicalSpecialty": "PrimaryCare",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "34 North San Mateo Drive, Suite 1",
          "addressLocality": "San Mateo",
          "addressRegion": "CA",
          "postalCode": "94401",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "San Mateo County, California"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:30",
            "closes": "17:00"
          }
        ],
        "sameAs": ["https://www.yelp.com/biz/ulrike-sujansky-md-san-mateo"]
      }
    </script>
  </head>

  <body>
    <form name="contact" method="POST" action="/" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="first_name" />
      <input type="text" name="last_name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
    <form name="membership-request" method="POST" action="/" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="membership-request" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="first_name" />
      <input type="text" name="last_name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
